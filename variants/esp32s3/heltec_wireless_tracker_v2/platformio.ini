[env:heltec-wireless-tracker-v2]
extends = esp32s3_base
board = heltec_wireless_tracker_v2
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/heltec_wireless_tracker_v2
  -D HELTEC_WIRELESS_TRACKER_V2

; ST7735S onboard TFT through the existing LovyanGFX renderer.
; HAS_TFT stays off so Neon Pebble's overlay-based menus remain available.
lib_deps =
  ${esp32s3_base.lib_deps}
  lovyan03/LovyanGFX@1.2.28
